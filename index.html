<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics Event Reader</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2330; --muted: #6b7686; --border: #e3e6ec;
    --accent: #2f5bea; --chip: #eef1f6;
    --c-screen: #7c3aed; --c-button: #0d9488; --c-api: #d97706; --c-other: #475569;
    --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f131a; --card: #171c26; --text: #e6e9ef; --muted: #8b95a7; --border: #262d3b; --chip: #212837; --accent: #7c9cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  textarea { width: 100%; height: 130px; resize: vertical; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 10px 0 20px; font-size: 13px; color: var(--muted); }
  .bar label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .ctx { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; }
  .ctx h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .ctx .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .pill b { color: var(--muted); font-weight: 500; }
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
  .ev { position: relative; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--kind); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .ev::before { content: ""; position: absolute; left: -27px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--kind); box-shadow: 0 0 0 3px var(--bg); }
  .ev summary { list-style: none; cursor: pointer; }
  .ev summary::-webkit-details-marker { display: none; }
  .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .head::after { content: "▸"; margin-left: auto; color: var(--muted); transition: transform .15s; }
  .ev[open] .head::after { transform: rotate(90deg); }
  .idx { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; font-size: 12px; color: #fff; background: var(--kind); padding: 1px 8px; border-radius: 4px; }
  .title { font-weight: 600; font-size: 16px; word-break: break-word; }
  .flow { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-all; }
  .flow code { color: var(--text); }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 4px; font-weight: 600; }
  .s2 { background: #dcfce7; color: var(--ok); } .s4 { background: #fee2e2; color: var(--err); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  td { padding: 3px 0; vertical-align: top; border-top: 1px solid var(--border); }
  td:first-child { width: 160px; color: var(--muted); padding-right: 10px; white-space: nowrap; }
  td:last-child { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
  td.empty { color: var(--muted); opacity: .6; }
  table table { margin: 0; } table table td:first-child { width: auto; }
  .true { color: var(--ok); } .false { color: var(--err); }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Analytics Event Reader</h1>
  <p class="sub">Paste raw analytics debugger output below. Everything is parsed locally in your browser.</p>
  <textarea id="input" placeholder="name: screenViewed&#10;properties: key: value, key: value&#10;-----------&#10;name: ..." spellcheck="false"></textarea>
  <div class="bar">
    <label><input type="checkbox" id="hideEmpty" checked> Hide empty values</label>
    <label><input type="checkbox" id="hoist" checked> Hoist shared properties</label>
    <label><input type="checkbox" id="reverse"> Newest first</label>
    <button id="clear">Clear</button>
    <span id="count"></span>
  </div>
  <div id="out"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const KEY_AT_START = /^\s*([A-Za-z_][\w.]*):(?:\s|$)/;

// Split "k: v, k: {a: b, c: d}, k: v" on top-level commas that precede a "key:" token.
function parseProps(s) {
  const parts = [];
  let depth = 0, start = 0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '{' || ch === '[') depth++;
    else if (ch === '}' || ch === ']') depth--;
    else if (ch === ',' && depth <= 0 && KEY_AT_START.test(s.slice(i + 1))) {
      parts.push(s.slice(start, i)); start = i + 1;
    }
  }
  parts.push(s.slice(start));
  const out = [];
  for (const p of parts) {
    const m = p.match(KEY_AT_START);
    if (!m) continue;
    let v = p.slice(m[0].length).trim();
    if (v.startsWith('{') && v.endsWith('}')) v = parseProps(v.slice(1, -1));
    out.push([m[1], v]);
  }
  return out;
}

function parse(text) {
  return text.split(/^\s*-{3,}\s*$/m).map(b => b.trim()).filter(Boolean).map(block => {
    const name = (block.match(/^name:\s*(.*)$/m) || [])[1]?.trim() || '(unnamed)';
    const pm = block.match(/^properties:\s*([\s\S]*)$/m);
    const props = pm ? parseProps(pm[1].replace(/\s*\n\s*/g, ' ')) : [];
    return { name, props };
  });
}

const get = (ev, k) => (ev.props.find(p => p[0] === k) || [])[1];
const kindOf = n => /screen/i.test(n) ? 'screen' : /button|tap|click/i.test(n) ? 'button' : /api|response|request/i.test(n) ? 'api' : 'other';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function valHtml(v) {
  if (Array.isArray(v)) return '<table>' + v.map(([k, x]) => `<tr><td>${esc(k)}</td><td>${valHtml(x)}</td></tr>`).join('') + '</table>';
  if (v === 'true' || v === 'false') return `<span class="${v}">${v}</span>`;
  return esc(v);
}

function render() {
  const text = $('input').value;
  localStorage.setItem('analytics-reader-input', text);
  let events = parse(text);
  $('count').textContent = events.length ? `${events.length} events` : '';
  if (!events.length) { $('out').innerHTML = '<div class="empty-state">Paste events above to see them here.</div>'; return; }

  const hideEmpty = $('hideEmpty').checked;
  // Props with identical values across every event (only meaningful with 2+ events).
  const shared = new Set();
  if ($('hoist').checked && events.length > 1) {
    for (const [k, v] of events[0].props) {
      if (typeof v === 'string' && events.every(e => get(e, k) === v)) shared.add(k);
    }
  }
  const emptyShared = new Set(), ctx = [];
  for (const [k, v] of events[0].props) {
    if (!shared.has(k)) continue;
    if (v === '') emptyShared.add(k); else ctx.push([k, v]);
  }

  let html = '';
  if (ctx.length) {
    html += '<div class="ctx"><h2>Shared across all events</h2><div class="kv">' +
      ctx.map(([k, v]) => `<span class="pill"><b>${esc(k)}</b> ${esc(v)}</span>`).join('') + '</div></div>';
  }

  const list = events.map((e, i) => ({ e, n: i + 1 }));
  if ($('reverse').checked) list.reverse();
  html += '<div class="timeline">' + list.map(({ e, n }) => {
    const kind = kindOf(e.name);
    const screen = get(e, 'screen'), prev = get(e, 'previousScreen');
    const btn = get(e, 'buttonName'), url = get(e, 'url'), status = get(e, 'statusCode');
    const title = btn || url || screen || e.name;
    const rows = e.props.filter(([k, v]) => !shared.has(k) && !(hideEmpty && v === ''));
    return `<details class="ev" style="--kind:var(--c-${kind})">
      <summary><div class="head"><span class="idx">#${n}</span><span class="name">${esc(e.name)}</span>
        <span class="title">${esc(title)}</span>
        ${status ? `<span class="badge ${status[0] === '2' ? 's2' : status[0] === '4' || status[0] === '5' ? 's4' : ''}">${esc(status)}</span>` : ''}</div></summary>
      ${prev && screen ? `<div class="flow"><code>${esc(prev)}</code> → <code>${esc(screen)}</code></div>` : ''}
      <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="${v === '' ? 'empty' : ''}">${v === '' ? '—' : valHtml(v)}</td></tr>`).join('')}</table>
    </details>`;
  }).join('') + '</div>';
  $('out').innerHTML = html;
}

$('input').value = localStorage.getItem('analytics-reader-input') || '';
['input', 'hideEmpty', 'hoist', 'reverse'].forEach(id => $(id).addEventListener(id === 'input' ? 'input' : 'change', render));
$('clear').onclick = () => { $('input').value = ''; render(); };
render();
</script>
</body>
</html>
